# Server
server.port=8080

# MongoDB
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/gymcal}
spring.data.mongodb.database=gymcal

# JWT
app.jwt.secret=${JWT_SECRET:gymcal-super-secret-key-change-in-production-min-256-bits}
app.jwt.expiration=86400000

# Gemini API (Google AI Studio — FREE)
# Get key from: https://aistudio.google.com/app/apikey
gemini.api.key=${GEMINI_API_KEY:your-gemini-key-here}

# CORS
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:5500,http://127.0.0.1:5500}

# Logging
logging.level.com.gymcal=DEBUG
logging.level.org.springframework.security=INFO
